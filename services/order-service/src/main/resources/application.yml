spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${ORDER_SERVICE_DATASOURCE_USERNAME:${POSTGRES_USER:ecommerce}}
    password: ${ORDER_SERVICE_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me-local-postgres}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${order.payment-results.group-id}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
      ack-mode: record
      observation-enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ECOMMERCE_SECURITY_ISSUER_URI:http://localhost:8085/realms/ecommerce}
          jwk-set-uri: ${ECOMMERCE_SECURITY_JWK_SET_URI:http://localhost:8085/realms/ecommerce/protocol/openid-connect/certs}

server:
  port: 8082

order:
  catalog:
    base-url: ${ORDER_SERVICE_CATALOG_BASE_URL:http://localhost:8081}
  payment-results:
    topic: ${ORDER_SERVICE_PAYMENT_RESULT_TOPIC:ecommerce.payment.events}
    group-id: ${ORDER_SERVICE_PAYMENT_RESULT_GROUP_ID:order-service.payment-results.v1}
    consumer-enabled: ${ORDER_SERVICE_PAYMENT_RESULT_CONSUMER_ENABLED:true}
    retry:
      max-attempts: ${ORDER_SERVICE_PAYMENT_RESULT_RETRY_MAX_ATTEMPTS:3}
      backoff: ${ORDER_SERVICE_PAYMENT_RESULT_RETRY_BACKOFF:PT1S}
      dead-letter-topic: ${ORDER_SERVICE_PAYMENT_RESULT_DLT_TOPIC:ecommerce.payment.events.DLT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},trace=%X{traceId:-},span=%X{spanId:-},correlation=%X{correlationId:-},event=%X{eventId:-},eventType=%X{eventType:-}]'
