spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USERNAME:${POSTGRES_USER:ecommerce}}
    password: ${CATALOG_DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local-postgres}}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ECOMMERCE_SECURITY_ISSUER_URI:http://localhost:8085/realms/ecommerce}
          jwk-set-uri: ${ECOMMERCE_SECURITY_JWK_SET_URI:http://localhost:8085/realms/ecommerce/protocol/openid-connect/certs}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: '%5p [${spring.application.name},trace=%X{traceId:-},span=%X{spanId:-},correlation=%X{correlationId:-}]'
