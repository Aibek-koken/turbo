name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    name: Maven suites and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Detect Docker
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository checks
        run: |
          scripts/project-validate.sh structure
          scripts/project-validate.sh docs-check
          scripts/project-validate.sh ci-config
          scripts/project-validate.sh maven-validate

      - name: Unit and OpenAPI tests
        run: timeout 20m scripts/project-validate.sh api-docs-test

      - name: Event contract tests
        run: timeout 15m scripts/project-validate.sh contract-test

      - name: Integration tests
        if: steps.docker.outputs.available == 'true'
        run: timeout 30m scripts/project-validate.sh integration-test

      - name: Skip integration tests without Docker
        if: steps.docker.outputs.available != 'true'
        run: echo "Docker is unavailable on this runner; skipping opt-in Testcontainers suites."

      - name: Upload Maven test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.log

  docker-smoke:
    name: Compose image build and full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect Docker
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Compose configuration
        if: steps.docker.outputs.available == 'true'
        run: timeout 5m scripts/project-validate.sh full-stack-config

      - name: Build local Compose images
        if: steps.docker.outputs.available == 'true'
        run: timeout 30m scripts/project-validate.sh compose-image-build

      - name: Full-stack smoke
        if: steps.docker.outputs.available == 'true'
        run: timeout 30m scripts/project-validate.sh full-stack-smoke

      - name: Skip Docker smoke without Docker
        if: steps.docker.outputs.available != 'true'
        run: echo "Docker is unavailable on this runner; skipping Compose image build and smoke coverage."

      - name: Capture Docker diagnostics
        if: failure() && steps.docker.outputs.available == 'true'
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/docker-compose-ps.txt || true
          docker compose logs --no-color --timestamps > diagnostics/docker-compose.log || true
          docker compose config > diagnostics/docker-compose-config.yml || true
          docker images > diagnostics/docker-images.txt || true

      - name: Upload Docker diagnostics
        if: failure() && steps.docker.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: diagnostics/**

      - name: Stop Compose services
        if: always() && steps.docker.outputs.available == 'true'
        run: docker compose stop
